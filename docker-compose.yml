services:
  growcast:
    image: 0xmrcl/growcast:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GROWCAST_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      GROWCAST_TRUST_PROXY: "1"
    volumes:
      - ./data:/app/data
      # Timelapse media only. Do not bind the whole extensions/ tree — GrowCast-GGS/.env
      # would otherwise be readable/owned by the internet-facing app user.
      - ./extensions/GrowCast-Timelapse:/app/extensions/GrowCast-Timelapse
      - ./public/setup:/app/public/setup
      - ./public/yourPictures:/app/public/yourPictures

  ggs:
    build:
      context: ./extensions/GrowCast-GGS
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./extensions/GrowCast-GGS/.env
        format: raw
    environment:
      GROWCAST_URL: http://growcast:3000
    depends_on:
      - growcast
