services:
  growcast:
    image: 0xmrcl/growcast:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GROWCAST_BIND:-127.0.0.1}:${GROWCAST_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        format: raw
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      GROWCAST_TRUST_PROXY: "1"
      GROWCAST_BIND: ${GROWCAST_BIND:-127.0.0.1}
      GROWCAST_PORT: ${GROWCAST_PORT:-3000}
      GROWCAST_GGS_ENV_FILE: /app/data/ggs.env
    volumes:
      - ./data:/app/data
      # Timelapse media only. Do not bind the whole extensions/ tree.
      - ./extensions/GrowCast-Timelapse:/app/extensions/GrowCast-Timelapse
      - ./public/setup:/app/public/setup
      - ./public/yourPictures:/app/public/yourPictures

  ggs:
    build:
      context: ./extensions/GrowCast-GGS
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1001:1001"
    environment:
      GROWCAST_URL: http://growcast:3000
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data:/data
      - ./docker/ggs-run.sh:/opt/growcast/ggs-run.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /opt/growcast/ggs-run.sh > /tmp/ggs-run.sh && exec /bin/sh /tmp/ggs-run.sh"]
    depends_on:
      - growcast

  restream:
    build:
      context: ./extensions/GrowCast-Restream
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "2gb"
    user: "1001:1001"
    environment:
      GROWCAST_URL: http://growcast:3000
      TWITCH_INGEST: ${TWITCH_INGEST:-rtmps://live.twitch.tv:443/app}
    volumes:
      - ./data/restream:/data/restream
    depends_on:
      - growcast

  timelapse:
    build:
      context: ./extensions/GrowCast-Timelapse
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1001:1001"
    environment:
      GROWCAST_URL: http://growcast:3000
      PYTHONDONTWRITEBYTECODE: "1"
      GROWCAST_TIMELAPSE_ENV: /data/timelapse.env
    volumes:
      - ./data:/data
      - ./extensions/GrowCast-Timelapse/snapshots:/app/GrowCast-Timelapse/snapshots
      - ./extensions/GrowCast-Timelapse/timelapse:/app/GrowCast-Timelapse/timelapse
      - ./docker/timelapse-run.sh:/opt/growcast/timelapse-run.sh:ro
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /opt/growcast/timelapse-run.sh > /tmp/timelapse-run.sh && exec /bin/sh /tmp/timelapse-run.sh"]
    depends_on:
      - growcast
