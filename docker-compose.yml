services:
  growcast:
    image: 0xmrcl/growcast:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GROWCAST_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        format: raw
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      GROWCAST_TRUST_PROXY: "1"
      GROWCAST_GGS_ENV_FILE: /run/growcast/ggs.env
    volumes:
      - ./data:/app/data
      # Timelapse media only. Do not bind the whole extensions/ tree.
      # This one file is the sidecar env the GGS settings login rewrites.
      - ./extensions/GrowCast-GGS/.env:/run/growcast/ggs.env
      - ./extensions/GrowCast-Timelapse:/app/extensions/GrowCast-Timelapse
      - ./public/setup:/app/public/setup
      - ./public/yourPictures:/app/public/yourPictures

  ggs:
    build:
      context: ./extensions/GrowCast-GGS
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./extensions/GrowCast-GGS/.env
        format: raw
        required: false
    environment:
      GROWCAST_URL: http://growcast:3000
    depends_on:
      - growcast

  restream:
    build:
      context: ./extensions/GrowCast-Restream
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "2gb"
    user: "1001:1001"
    environment:
      GROWCAST_URL: http://growcast:3000
      TWITCH_INGEST: ${TWITCH_INGEST:-rtmps://live.twitch.tv:443/app}
    volumes:
      - ./data:/data
    depends_on:
      - growcast
